# Ruff settings for the Python art pipeline in tools/ (and the odd script at the
# repo root). Run through `just code_cleanup`, which formats and lints only the
# Python files a branch has changed -- see tools/code_cleanup.py for why.

target-version = "py310"
line-length = 100

[format]
# The scripts mix ' and " roughly 60/40 and neither is wrong. "preserve" keeps a
# formatting pass from turning every string literal in a touched file into a diff.
quote-style = "preserve"

[lint]
# Ruff's defaults (E4, E7, E9, F) plus whitespace (W), import order (I),
# likely bugs (B) and outdated syntax (UP).
select = ["E4", "E7", "E9", "F", "W", "I", "B", "UP"]
ignore = [
    # The generators put tools/ on sys.path and then import a sibling module
    # (pixel_art, png_to_bmp), which has to come after the path edit.
    "E402",
]
